name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish. Defaults to v<VERSION>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Resolve release metadata
        id: metadata
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"

          if [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${VERSION}"
          fi

          EXPECTED_TAG="v${VERSION}"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag '$TAG' does not match VERSION/package.json ('$EXPECTED_TAG')." >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "vsix=${PACKAGE_NAME}-${VERSION}.vsix"
          } >> "$GITHUB_OUTPUT"

      - name: Build VSIX
        run: bash ./scripts/build-vsix.sh

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          VSIX: ${{ steps.metadata.outputs.vsix }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Automated VSIX release for ProtoNav ${VERSION}."
          fi
